[package]
name = "redline-core"
version = "0.1.0"
edition = "2024"
authors = ["Parth Patel <parthspatel.nj@gmail.com>"]
license = ""
description = "A comprehensive text diffing library with extensible normalization and tokenization"
repository = "https://github.com/parthspatel/redline"
keywords = ["diff", "text", "nlp", "tokenization", "normalization"]
categories = ["text-processing", "algorithms"]

[lib]
name = "redline_core"
path = "src/lib.rs"

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[dependencies]
# For Unicode normalization (accents removal)
unicode-normalization = "0.1"
console = { version = "0.16", features = ["std"], optional = true }

candle-core = { version = "0.9.1" }
candle-nn = { version = "0.9.1" }
candle-transformers = { version = "0.9.1" }
hf-hub = { version = "0.4.3" }
tokenizers = { version = "0.22.2" }
anyhow = { version = "1.0" }
serde_json = { version = "1.0" }

[features]
default = []
# Apple Silicon: cargo run --release --features metal,accelerate
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
accelerate = ["candle-core/accelerate"]
# Linux NVIDIA: cargo run --release --features cuda
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
# Intel CPUs: cargo run --release --features mkl
mkl = ["candle-core/mkl"]

[profile.release]
lto = true
codegen-units = 1



