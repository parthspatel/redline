[package]
name = "redline-core"
version = "0.1.0"
edition = "2024"
authors = ["Parth Patel"]
license = "MIT"
description = "High-performance text diffing & analysis framework"

[lib]
name = "redline_core"
path = "src/lib.rs"

[dependencies]
bumpalo = { version = "3.19", features = ["collections", "allocator-api2"] }
hashbrown = { version = "0.16", default-features = false, features = ["allocator-api2", "default-hasher"] }
thiserror = { version = "2.0", default-features = false }

# Optional dependencies
serde = { version = "1", features = ["derive"], optional = true }
tracing = { version = "0.1", optional = true }
pyo3 = { version = "0.24", optional = true }

[dev-dependencies]
static_assertions = "1.1"
proptest = "1.6"

[features]
default = ["std"]
std = []
async = ["std"]
serde = ["dep:serde"]
tracing = ["dep:tracing"]
python = ["std", "dep:pyo3"]
wasm = []
